[project]
name = "prime-agent-bench"
version = "0.2.0"
description = "Cross-product benchmark harness: Prime Agent (Rust/TS) vs Claude Code vs Codex CLI vs Pi Mono"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pyte>=0.8.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
