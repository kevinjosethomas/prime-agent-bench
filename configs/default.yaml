# Prime Agent bench: the default single-node configuration.
# Every knob mirrors bench.core.config.DEFAULTS; the node setup is the
# proven benchmark-node layout (~/bench/{harness,homes,results,...}).

bench_root: ~/bench
# results_dir: null  # default: <bench_root>/results

product_order: [rust, ts, claude, codex, pi]
display:
  rust: Prime Agent Rust
  ts: Prime Agent TS
  claude: Claude Code
  codex: Codex CLI
  pi: Pi Mono

install:
  node_runtime_paths: [/usr/lib/node_modules/npm, /usr/bin/node]

driver: pty
mock:
  port: 8788

# The kernel toolchain `bench vendor build` ships whenever a selected
# product builds a kernel venv (rust, ts): uv + its pinned pythons.
vendor:
  toolchain:
    - {src: ~/.local/bin/uv, dst: root/.local/bin/uv}
    - {src: ~/.local/bin/uvx, dst: root/.local/bin/uvx}
    - {src: ~/.local/share/uv, dst: root/.local/share/uv}

settle:
  timeout_s: 300.0
  first_paint_timeout_s: 240.0
  key_pause_s: 0.7
  loop_s: 0.8
  echo_wait_s: 1.2

aa:
  spread_threshold_pct: 10.0
  # Rank policy. The default is the validation-only smoke mode: analysis
  # reports stats, marks and denominators but NEVER emits ranks. A
  # publishable campaign declares its cohort explicitly:
  #   required: true
  #   trials: 4                        # the campaign's --aa-trials count
  #   expected_products: [rust, ts]    # or per benchmark:
  #     # expected_products: {session.cold_open_10mib: [rust, ts], ...}
  # Every expected product must publish a valid primary p50, carry >= trials
  # valid A/A rows on the primary, and pass the spread/drift stability gate —
  # any gap withholds the whole benchmark's ranks (no partial leaderboards).
  required: false
  # 20 = the calibration default: 10 trials per BALANCED half (exact
  # occurrence-position and ABBA-direction balance; aa_validation._aa_half)
  trials: 20
  expected_products: null
  drift_threshold_pct: 10.0   # max p50 drift between the A/A pass and the waves

noop_control:
  rounds: 30

load_gate:
  compile_markers: [rustc, cargo, /tsc, esbuild, npm exec, node-gyp, cc1, clang]
  load_threshold: 0.6
  max_wait_s: 300.0
  poll_s: 2.0

benchmarks: {}  # per-benchmark overrides, e.g. {compare.cold_start: {trials: 10}}
