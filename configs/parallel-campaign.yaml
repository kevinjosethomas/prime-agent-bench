# Campaign sandbox specs: ONE sandbox per product, 4c/8GB/60GB ubuntu:22.04 VMs.
# Each sandbox runs its product's full benchmark set sequentially (fairness
# by identical hardware + the same harness); products run in parallel.

backend: prime
aa_trials: 20
keep_sandboxes: true
wave_timeout_s: 14400.0
port_base: 8890

reference:
  outlier_pct: 5.0
  outlier_policy: replace
  max_replacements: 2

retry:
  max_retries: 2

sandboxes: {}
sandbox_defaults:
  image: ubuntu:22.04
  cpu_cores: 4
  memory_gb: 8
  disk_gb: 60
  timeout_minutes: 240
  bootstrap: bash /root/bench-harness/vendor/bootstrap.sh

benchmarks:
  compare.cold_start: {}
  compare.warm_start: {}
  compare.msg_send: {}
  compare.scroll_typing: {}
  compare.memory_idle_load: {}
  compare.install_disk: {}
  session.cold_open_10mib: {}
  session.agent_view_roundtrip: {}
  daemon.boot: {}

groupings: {}
