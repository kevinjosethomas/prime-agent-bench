# cmp5-20260928-163659 orchestration: one Prime VM sandbox per benchmark
# type, ALL FIVE products sequentially inside each sandbox (cross-product
# fairness on identical hardware; the plan's same-VM rule).

backend: prime
aa_trials: 10
keep_sandboxes: false
wave_timeout_s: 14400.0
port_base: 8890

reference:
  outlier_pct: 5.0
  outlier_policy: replace
  max_replacements: 2

retry:
  max_retries: 2

sandboxes: {}
sandbox_defaults:
  image: ubuntu:22.04
  cpu_cores: 4
  memory_gb: 8
  disk_gb: 60
  timeout_minutes: 240
  bootstrap: bash /root/bench-harness/vendor/bootstrap.sh

benchmarks:
  compare.cold_start: {}
  compare.warm_start: {}
  compare.msg_send: {}
  compare.scroll_typing: {}
  compare.memory_idle_load: {}
  compare.install_disk: {}
  session.cold_open_10mib: {memory_gb: 12}
  session.agent_view_roundtrip: {}
  daemon.boot: {}
  kernel.cold_start: {memory_gb: 12}
  kernel.cell_exec: {memory_gb: 12}
  kernel.state_snapshot_10MB: {memory_gb: 12}
  kernel.state_snapshot_50MB: {memory_gb: 16}

groupings: {}
