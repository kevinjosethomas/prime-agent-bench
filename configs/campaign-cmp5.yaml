# Five-product campaign cmp5-20260928-163659 (latest stable pins,
# strictly mock-routed: NO real inference anywhere, INCLUDING compare.msg_send
# — every product answers from the offline mock provider script; the previous
# campaign config (configs/campaign.yaml) explicitly selected real-api
# msg_send and MUST NOT be reused for this campaign).
# Controller-side config: ~/bench tree, campaign results, per-benchmark overrides.
bench_root: ~/bench-cmp5
results_dir: ~/bench-cmp5/results-cmp5-20260928

product_order: [rust, ts, claude, codex, pi]
display:
  rust: Prime Agent Rust
  ts: Prime Agent TS
  claude: Claude Code
  codex: Codex CLI
  pi: Pi Mono

install:
  node_runtime_paths: [/usr/lib/node_modules/npm, /usr/bin/node]

driver: pty
mock:
  port: 8788

vendor:
  toolchain:
    - {src: ~/.local/bin/uv, dst: root/.local/bin/uv}
    - {src: ~/.local/bin/uvx, dst: root/.local/bin/uvx}
    - {src: ~/.local/share/uv, dst: root/.local/share/uv}

settle:
  timeout_s: 300.0
  first_paint_timeout_s: 240.0
  key_pause_s: 0.7
  loop_s: 0.8
  echo_wait_s: 1.2

aa:
  spread_threshold_pct: 5.0

noop_control:
  rounds: 30

load_gate:
  compile_markers: [rustc, cargo, /tsc, esbuild, npm exec, node-gyp, cc1, clang]
  load_threshold: 0.6
  max_wait_s: 300.0
  poll_s: 2.0

benchmarks:
  # strictly mock-routed for EVERY product (the campaign decision): the
  # per-benchmark override beats the product-level msg_routing declaration
  # (codex product.yaml pins real-api from the real-api campaign era)
  compare.msg_send:
    msg_routing: mock
