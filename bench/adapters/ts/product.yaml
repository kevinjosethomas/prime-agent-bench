binary: ~/.local/share/prime-agent/bin/prime-agent
revision: official-0.9.6
needs_kernel_venv: true
install:
  installed_paths:
  - ~/.local/share/prime-agent/releases/0.9.6-linux-x64-69e5bb9173d0ed6df270aa59bb9919a05a2dc7076af6f830254820735bc996fb
  - ~/.local/share/prime-agent/bin
  download_is_installed: true
  note: official 0.9.6 stable (GitHub release v0.9.6) installed in the install.sh
    layout; stale node-local release dirs excluded from the vendor payload
auth_sources:
- src: ~/.prime/config.json
  note: PRIME_API_KEY for the trial env
- src: ~/.prime/agent/auth.json
  note: preprovisioned Prime auth
- src: ~/.prime/agent/settings.json
  note: product settings
first_run_dialogs:
- marker: Share agent traces with Prime Intellect?
  keys:
  - down
  - enter
  intent: Not now
vendor:
- src: ~/.local/share/prime-agent
  dst: root/.local/share/prime-agent
  exclude:
  - releases/0.1.0-*
  - releases/0.10.0-*
  - releases/0.9.5-*
- src: ~/.prime/config.json
  dst: root/.prime/config.json
- src: ~/.prime/agent/auth.json
  dst: root/.prime/agent/auth.json
- src: ~/.prime/agent/settings.json
  dst: root/.prime/agent/settings.json
