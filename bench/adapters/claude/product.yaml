binary: /usr/bin/claude
revision: npm@latest
install:
  installed_paths:
  - /usr/lib/node_modules/@anthropic-ai
  npm_pkg: '@anthropic-ai/claude-code'
  npm_version: 2.1.285
# the trial home is built clean (no operator ~/.claude: settings, hooks,
# plugins, history); mock routing authenticates from the env
auth_sources:
- src: ~/.prime/config.json
  note: Prime API key + team id for the real-api Anthropic-protocol route (Prime Inference)
first_run_dialogs:
- marker: 1. Auto (match terminal)
  keys:
  - enter
  intent: theme picker
- marker: Do you want to use this API key?
  keys:
  - up
  - enter
  intent: Yes (the mock provider key)
- marker: Press Enter to continue
  keys:
  - enter
  intent: security note
- marker: Is this a project you created or one you trust?
  keys:
  - down
  - enter
  intent: workspace trust
vendor:
- src: /usr/lib/node_modules/@anthropic-ai
  dst: usr/lib/node_modules/@anthropic-ai
- src: /usr/bin/claude
  dst: usr/bin/claude
- src: ~/.prime/config.json
  dst: root/.prime/config.json

# the prompt input row: the text before the typed probe token must fully
# match this regex (the product's prompt glyph) for the echo to count
input_prompt: '\s*[│|]?\s*[❯>]\s*'
