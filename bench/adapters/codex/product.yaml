binary: /usr/bin/codex
revision: npm@latest
msg_routing: real-api
install:
  installed_paths:
  - /usr/lib/node_modules/@openai
  npm_pkg: '@openai/codex'
  npm_version: 0.157.0
auth_sources:
- src: ~/.codex
  excl:
  - tmp
  - .tmp
  note: full device state; copied ChatGPT tokens do NOT authenticate a copied home
- src: ~/.pi/agent/auth.json
  note: "the OpenAI API key (openai.key) for the real-api api-key route \u2014 the\
    \ ChatGPT OAuth cannot survive isolated trial homes (single-use refresh tokens\
    \ rotate the family on first refresh)"
first_run_dialogs:
- marker: 3. Provide your own API key
  keys:
  - '3'
  intent: welcome/login menu (copied ChatGPT tokens never authenticate a copied home)
- marker: Paste or type your API key
  keys:
  - sk-bench-dummy-not-real
  - enter
  intent: key box -> settled dummy-key baseline state
- marker: Press enter to continue
  keys:
  - enter
  intent: generic continue
- marker: Trust and continue
  keys:
  - enter
  intent: folder trust (option 1 preselected, enter confirms)
vendor:
- src: /usr/lib/node_modules/@openai
  dst: usr/lib/node_modules/@openai
- src: /usr/bin/codex
  dst: usr/bin/codex
- src: ~/.codex
  dst: root/.codex
  exclude:
  - tmp
  - .tmp
- src: ~/.pi/agent/auth.json
  dst: root/.pi/agent/auth.json
