binary: /usr/bin/codex
revision: npm@latest
msg_routing: mock
install:
  installed_paths:
  - /usr/lib/node_modules/@openai
  npm_pkg: '@openai/codex'
  npm_version: 0.159.2
auth_sources:
- src: ~/.codex/models_cache.json
  note: the model catalog cache only; the trial home is otherwise built clean (copied ChatGPT tokens never authenticate a copied home; the prepass walk settles the
    dummy apikey state, and mock routing only pins openai_base_url in config.toml - the wire_api stays responses, the mock serves it)
- src: ~/.pi/agent/auth.json
  note: "the OpenAI API key (openai.key) for the real-api api-key route \u2014 the\
    \ ChatGPT OAuth cannot survive isolated trial homes (single-use refresh tokens\
    \ rotate the family on first refresh)"
first_run_dialogs:
- marker: Try new model
  keys:
  - down
  - enter
  intent: 'the api-key route''s model upsell: keep the pinned model (option 2) so
    the row measures what it says'
- marker: 3. Provide your own API key
  keys:
  - '3'
  intent: welcome/login menu (copied ChatGPT tokens never authenticate a copied home)
- marker: Paste or type your API key
  keys:
  - sk-bench-dummy-not-real
  - enter
  intent: key box -> settled dummy-key baseline state
- marker: Skip until next version
  keys:
  - '3'
  intent: the startup update prompt (check_for_update_on_startup is off in every trial home; if it still shows, never install - option 3 skips; must precede the generic continue, whose enter selects "Update now")
- marker: Press enter to continue
  keys:
  - enter
  intent: generic continue
- marker: Trust and continue
  keys:
  - enter
  intent: folder trust (option 1 preselected, enter confirms)
vendor:
- src: /usr/lib/node_modules/@openai
  dst: usr/lib/node_modules/@openai
- src: /usr/bin/codex
  dst: usr/bin/codex
- src: ~/.codex/models_cache.json
  dst: root/.codex/models_cache.json
- src: ~/.pi/agent/auth.json
  dst: root/.pi/agent/auth.json

# the prompt input row: the text before the typed probe token must fully
# match this regex (the product's prompt glyph) for the echo to count
input_prompt: '\s*›\s*'
