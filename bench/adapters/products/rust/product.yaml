# Prime Agent (Rust) — the complete product config, one file.
# binary: the pinned from-source build. first_run_dialogs: the onboarding
# walk (config, not code). vendor: what sandbox setup ships for this
# product. See README.md in this folder for needs/quirks/fix classes.
binary: ~/bench/repos/prime-agent-rust/target/release/prime-agent
revision: 2017ac619e8cc83dd652704be072c4d7a22ff0aa
needs_kernel_venv: true
install:
  installed_paths: [~/bench/repos/prime-agent-rust/target/release/prime-agent]
  download_bytes: 7843159  # git archive of origin/rust (source distribution)
  note: from-source cargo --release build; source archive bytes as download
auth_sources:
  - {src: ~/.prime/config.json, note: PRIME_API_KEY for the trial env}
  - {src: ~/.prime/agent/auth.json, note: preprovisioned Prime auth}
  - {src: ~/.prime/agent/settings.json, note: product settings}
first_run_dialogs:
  - marker: "Share agent traces with Prime Intellect?"
    keys: [down, enter]
    intent: "Not now"
vendor:
  - {src: ~/bench/repos/prime-agent-rust/target/release/prime-agent, dst: root/bench/repos/prime-agent-rust/target/release/prime-agent}
  - {src: ~/bench/repos/prime-agent-rust/target/release/prime-agent-runtime, dst: root/bench/repos/prime-agent-rust/target/release/prime-agent-runtime}
  - {src: ~/.prime/config.json, dst: root/.prime/config.json}
  - {src: ~/.prime/agent/auth.json, dst: root/.prime/agent/auth.json}
  - {src: ~/.prime/agent/settings.json, dst: root/.prime/agent/settings.json}
