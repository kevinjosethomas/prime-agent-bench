# Pi Mono — the complete product config, one file.
binary: ~/bench/repos/pi-mono/packages/coding-agent/dist/bundle/cli.js
revision: b45597504eeaba1f11a9920a1d1048c361ed4b8e
install:
  installed_paths: [~/bench/repos/pi-mono/node_modules, ~/bench/repos/pi-mono/packages]
  npm_pkg: "@mariozechner/pi-coding-agent"
  npm_version: "0.73.0"
  note: built from source; pack may 404 if unpublished
auth_sources:
  - {src: ~/.prime/agent/auth.json, note: the copied auth.json keeps pi authenticated (provider/model flags route traffic to the mock)}
first_run_dialogs:
  # Loaded-session resume only: pi asks this when a resumed session's
  # recorded cwd does not exist. prepare_native_fixture creates the recorded
  # cwd, so the prompt normally never appears; the entry is the fallback
  # (settle/prepass walks answer it if cwd creation ever fails).
  - marker: "cwd from session file does not exist"
    keys: [enter]
    intent: "continue loaded session in the launch cwd"
vendor:
  - {src: ~/bench/repos/pi-mono, dst: root/bench/repos/pi-mono}
  - {src: ~/.prime/agent/auth.json, dst: root/.prime/agent/auth.json}
  - {src: ~/.prime/agent/settings.json, dst: root/.prime/agent/settings.json}
  - {src: ~/.prime/config.json, dst: root/.prime/config.json}
