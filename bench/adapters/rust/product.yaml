binary: ~/bench-r2/rust/bin/prime-agent-rust
revision: e75f59efc6f74fcb23e45048f0f23b34490571d0
needs_kernel_venv: true
install:
  installed_paths:
  - ~/bench-r2/rust/share/prime-agent-rust
  note: r2 pin - org main tip e75f59efc6f7 release-pipeline build (rustc 1.98.1, split-debug
    shipped binary, GLIBC 2.34 <= 2.35 baseline gate, fixture catalog, assemble_artifacts
    --sha) staged in the install-rust.sh launcher+payload shape at bench-r2/rust
auth_sources:
- src: ~/.prime/config.json
  note: PRIME_API_KEY for the trial env
- src: ~/.prime/agent/auth.json
  note: preprovisioned Prime auth
- src: ~/.prime/agent/settings.json
  note: product settings (settled provider/model defaults + onboarding state)
first_run_dialogs:
- marker: Share agent traces with Prime Intellect?
  keys:
  - down
  - enter
  intent: Not now
vendor:
- src: ~/bench-r2/rust/bin/prime-agent-rust
  dst: root/bench-r2/rust/bin/prime-agent-rust
- src: ~/bench-r2/rust/share/prime-agent-rust
  dst: root/bench-r2/rust/share/prime-agent-rust
- src: ~/.prime/config.json
  dst: root/.prime/config.json
- src: ~/.prime/agent/auth.json
  dst: root/.prime/agent/auth.json
- src: ~/.prime/agent/settings.json
  dst: root/.prime/agent/settings.json

# r2 pin (2026-09-30): the org-main-tip release-pipeline build staged at
# ~/bench-r2/rust (launcher bin/prime-agent-rust + exe-adjacent packaged
# payload share/prime-agent-rust: binary + package.json + prime-agent-runtime/
# + skills/ + bundled catalogs). The payload binary's sha256 is pinned; a
# swapped or stale binary fails loudly at version_info.
binary_sha256: 0ba7c9b6e6277b6301605769240d133727d59dc1997890e333e54518ce5a88e5

# the prompt input row: the text before the typed probe token must fully
# match this regex (the product's prompt glyph) for the echo to count
input_prompt: '\s*>\s*'
